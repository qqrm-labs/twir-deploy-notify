name: TWIR Fixture verify

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Fixture file from tests/ to send and verify in the dev chat
        required: true
        default: 2025-07-02-this-week-in-rust.md
      verify_updates:
        description: Attempt getUpdates-based verification after sending (may not work for channel-style chats)
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.fixture }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_PROGRESS_WHEN: never
  RUST_LOG: info
  FIXTURE: ${{ inputs.fixture }}

jobs:
  verify:
    name: Verify fixture delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: fixture-verify
          workspaces: |
            . -> target

      - name: Validate fixture path
        run: |
          set -euo pipefail
          test -f "tests/$FIXTURE"

      - name: Send fixture to dev chat
        env:
          DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
          DEV_CHAT_ID: ${{ secrets.DEV_CHAT_ID }}
          TWIR_SKIP_PRODUCTION_SEND: 'true'
        run: |
          set -euo pipefail

          rm -f output_*.md
          cargo run --quiet --bin twir-deploy-notify -- "tests/$FIXTURE"

      - name: Verify delivered messages via getUpdates
        if: inputs.verify_updates == 'true'
        env:
          DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
          DEV_CHAT_ID: ${{ secrets.DEV_CHAT_ID }}
        run: |
          set -euo pipefail

          cargo run --quiet --bin verify-posts -- "tests/$FIXTURE"

      - name: Upload generated posts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-fixture-posts
          path: output_*.md
          if-no-files-found: ignore
