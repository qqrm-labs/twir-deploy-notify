name: TWIR Dev summary

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: TWIR dev summary delivery
    uses: ./.github/workflows/common-delivery.yml
    permissions:
      contents: write
      actions: read
    secrets:
      DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
      DEV_CHAT_ID: ${{ secrets.DEV_CHAT_ID }}
      PROD_BOT_TOKEN: ${{ secrets.PROD_BOT_TOKEN }}
      PROD_CHAT_ID: ${{ secrets.PROD_CHAT_ID }}
    with:
      scope: dev
      send_main: false
      send_dev: true
      rust_log: debug
      check_last_sent: false
