name: TWIR Common delivery

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
      send_main:
        required: true
        type: boolean
      send_dev:
        required: false
        type: boolean
        default: true
      rust_log:
        required: false
        type: string
        default: info
      artifact_scope:
        required: false
        type: string
      check_last_sent:
        required: false
        type: boolean
        default: true
    secrets:
      DEV_BOT_TOKEN:
        required: true
      DEV_CHAT_ID:
        required: true
      PROD_BOT_TOKEN:
        required: true
      PROD_CHAT_ID:
        required: true

jobs:
  notify:
    name: TWIR delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: twir-common-delivery-${{ inputs.scope }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_PROGRESS_WHEN: never
      RUST_LOG: ${{ inputs.rust_log }}
      ARTIFACT_SCOPE: ${{ inputs.artifact_scope != '' && inputs.artifact_scope || inputs.scope }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
          rustflags: ""

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          cache-workspace-crates: true
          shared-key: delivery-portable
          workspaces: |
            . -> target

      - name: Download last_sent artifact from previous successful run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Server-side status/branch filters can return a stale run index.
          # Filter the recent runs locally and include successful manual
          # production deliveries from release branches so their markers
          # carry forward to main after a recovery.
          ids=$(
            gh api \
              "repos/${{ github.repository }}/actions/workflows/prod.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0:10][] | .id' \
            || echo ""
          )

          scope="$ARTIFACT_SCOPE"
          names=()

          append_unique() {
            local candidate="$1"
            if [ -z "$candidate" ]; then
              return 0
            fi
            for existing in "${names[@]}"; do
              if [ "$existing" = "$candidate" ]; then
                return 0
              fi
            done
            names+=("$candidate")
          }

          if [ -n "$scope" ]; then
            append_unique "last-sent-$scope"
            IFS='-' read -r -a scope_parts <<< "$scope"
            for part in "${scope_parts[@]}"; do
              if [ -n "$part" ]; then
                append_unique "last-sent-$part"
              fi
            done
          fi

          append_unique "last-sent"

          for prev in $ids; do
            for name in "${names[@]}"; do
              if gh run download "$prev" -n "$name" --dir . && [ -s last_sent.txt ]; then
                echo "Restored last_sent marker from run $prev (artifact $name)."
                exit 0
              fi
              rm -f last_sent.txt
            done
          done

          # The marker chain must never break a run: continue without cached
          # state; a successful delivery below republishes the marker and
          # rebuilds the chain (the prod pin guard still blocks duplicates).
          echo "::warning::No recent run yielded a last_sent marker; continuing without cached state." >&2

      - name: Checkout TWIR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: rust-lang/this-week-in-rust
          path: twir
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/

      - name: Determine latest post
        id: prepare
        run: |
          set -euo pipefail

          posts=(twir/content/*-this-week-in-rust*.md)
          latest_post="${posts[-1]}"
          test -f "$latest_post"
          echo "latest_post=$latest_post" >> "$GITHUB_OUTPUT"

          check_last_sent="${{ inputs.check_last_sent }}"
          if [ "$check_last_sent" = "false" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sent=$(cat last_sent.txt 2>/dev/null || echo "")
          if [ "$latest_post" != "$last_sent" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send to dev chat
        if: steps.prepare.outputs.send == 'true' && inputs.send_dev == true
        env:
          LATEST_POST: ${{ steps.prepare.outputs.latest_post }}
          DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
          DEV_CHAT_ID: ${{ secrets.DEV_CHAT_ID }}
          TWIR_SKIP_PRODUCTION_SEND: 'true'
        run: |
          set -euo pipefail

          rm -f output_*.md
          cargo run --quiet --bin twir-deploy-notify -- "$LATEST_POST"

      - name: Restore durable production progress
        if: steps.prepare.outputs.send == 'true' && inputs.send_main == true
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_STATE_KEY: production.json
        run: |
          status=0
          python3 .github/scripts/delivery_state.py restore state/production.json || status=$?
          if [ "$status" = 3 ]; then
            mkdir -p state
            printf '%s\n' '{"digest":"","parts":0,"target":"","message_ids":[]}' > state/production.json
            python3 .github/scripts/delivery_state.py save state/production.json
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: Send to main chat
        if: steps.prepare.outputs.send == 'true' && inputs.send_main == true
        env:
          LATEST_POST: ${{ steps.prepare.outputs.latest_post }}
          TWIR_DELIVERY_STATE: state/production.json
          DELIVERY_CHECKPOINT: .github/scripts/delivery_state.py
          DELIVERY_STATE_KEY: production.json
          GH_TOKEN: ${{ github.token }}
          PROD_BOT_TOKEN: ${{ secrets.PROD_BOT_TOKEN }}
          PROD_CHAT_ID: ${{ secrets.PROD_CHAT_ID }}
          TWIR_SKIP_DEVELOPER_SEND: ${{ inputs.send_dev != true }}
        run: |
          set -euo pipefail

          cargo run --quiet --bin twir-deploy-notify -- "$LATEST_POST"

      - name: Save last_sent marker
        env:
          LATEST_POST: ${{ steps.prepare.outputs.latest_post }}
        if: steps.prepare.outputs.send == 'true' && (inputs.send_main == true || inputs.send_dev == true)
        run: |
          set -euo pipefail

          printf '%s\n' "$LATEST_POST" > last_sent.txt

      - name: Upload generated posts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegram-posts-${{ env.ARTIFACT_SCOPE }}
          path: output_*.md
          if-no-files-found: ignore

      # Every successful run must hand the marker forward: skip that only
      # when the delivery itself failed, so the next run retries this issue.
      - name: Upload last_sent artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: last-sent-${{ env.ARTIFACT_SCOPE }}
          path: last_sent.txt
          if-no-files-found: error
