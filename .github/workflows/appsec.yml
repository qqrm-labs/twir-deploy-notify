name: AppSec
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 2'
permissions:
  contents: read
jobs:
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: qqrm-labs/.github/.github/workflows/security.yml@8378b923612b318969f356dd4b900ff469f7de94
    with:
      # Run CodeQL for every PR, including dependency and toolchain changes.
      language: rust,actions
      codeql-mode: advanced
